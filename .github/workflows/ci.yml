name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-parse-plan:
    name: parse-plan unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: make -C .github/actions/parse-plan test

  release-please:
    name: Run release-please
    if: ${{ github.event_name == 'push' }}
    needs:
      - test-parse-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
