name: "Test parse-plan"

on:
  pull_request:

jobs:
  parse-plan:
    name: parse-plan unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: make -C .github/actions/parse-plan test
